# [Grok-Bot] V1.70: Laedt die Prayer-MP3s aus dem Dropbox-Freigabeordner (dl=1),
# kodiert sie auf 128 kbps (Kanalzahl wie im Original, Dateien <= 128 kbps werden nur kopiert)
# und legt sie als audio/<id>.mp3 ins Repo. Quellenliste: audio/sources.txt
name: fetch-audio
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fetch-audio
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
          ffmpeg -version | head -1
      - name: MP3s laden und umkodieren
        run: |
          set -euo pipefail
          BASE="https://www.dropbox.com/scl/fo/9jrivp0fkl4bfo9t0dejx"
          KEY="rlkey=s8lox2d2652b2i133h1jjty3k&dl=1"
          mkdir -p audio tmp
          grep -v '^#' audio/sources.txt | grep '|' | while IFS='|' read -r id path; do
            [ -n "$id" ] || continue
            curl -fsSL --retry 3 -o "tmp/$id.src" "$BASE/$path?$KEY"
            br=$(ffprobe -v error -select_streams a:0 -show_entries stream=bit_rate -of csv=p=0 "tmp/$id.src" | tr -dc 0-9)
            ch=$(ffprobe -v error -select_streams a:0 -show_entries stream=channels -of csv=p=0 "tmp/$id.src" | tr -dc 0-9)
            [ -n "$ch" ] || { echo "kein Audio: $id"; exit 1; }
            if [ -n "$br" ] && [ "$br" -le 140000 ]; then
              ffmpeg -nostdin -v error -y -i "tmp/$id.src" -map 0:a:0 -c:a copy -map_metadata -1 "audio/$id.mp3"
            else
              ffmpeg -nostdin -v error -y -i "tmp/$id.src" -map 0:a:0 -c:a libmp3lame -b:a 128k -ac "$ch" -map_metadata -1 "audio/$id.mp3"
            fi
            d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "audio/$id.mp3")
            echo "$id  ch=$ch  src_br=$br  dur=$d  size=$(stat -c %s "audio/$id.mp3")"
          done
          rm -rf tmp
          du -ch audio/*.mp3 | tail -1
      - name: Commit
        run: |
          git config user.name "Grok-Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/*.mp3
          if git diff --cached --quiet; then echo "keine Aenderung"; exit 0; fi
          git commit -m "[Grok-Bot] V1.70: Audio ins Repo"
          git push
