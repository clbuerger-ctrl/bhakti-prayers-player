function loadMem(){
  try{ return JSON.parse(localStorage.getItem("bpp-mem")||"{}"); }catch(e){ return {}; }
}
function saveMem(m){
  try{ localStorage.setItem("bpp-mem", JSON.stringify(m)); }catch(e){}
}
function songState(id){
  var m=loadMem();
  return (m.songs&&m.songs[id])||{};
}
function putSong(id, patch){
  var m=loadMem();
  if(!m.songs) m.songs={};
  var s=m.songs[id]||{};
  Object.keys(patch).forEach(function(k){ s[k]=patch[k]; });
  s.at=Date.now();
  m.songs[id]=s;
  m.lastId=id;
  saveMem(m);
}
function persistNow(){
  if(i<0) return;
  var P=PRAYERS[i];
  var t=0;
  try{ if(a.src && isFinite(a.currentTime)) t=a.currentTime; }catch(e){}

    document.getElementById("hint").textContent=(lang==="en"?(P.hinweisEn||P.hinweis): (P.hinweisDe||P.hinweis))||"";
  }
}
function setLang(l){
  lang=l;
  try{ localStorage.setItem("bpp-lang", lang); }catch(e){}
  persistNow();
  applyUI(); paintList(); paintLyrics();
}
function layoutLyrics(){
  /* [Grok.com] Standard: Schrift so gross wie moeglich, laengste Zeile fuellt das Fenster, Ende bleibt sichtbar */
  var box=document.getElementById("lyrics");
  if(!box) return;
  var cs=getComputedStyle(box);
  var w=(box.clientWidth||0)-parseFloat(cs.paddingLeft||0)-parseFloat(cs.paddingRight||0);
  if(w<=0) return;
  box.style.setProperty("--sc","1");
  box.classList.remove("cols-2","cols-3","fitwrap");
  box.classList.add("measure");
  var L=0;
  box.querySelectorAll(".rowline .sa .ln").forEach(function(el){ var x=el.getBoundingClientRect().width; if(x>L) L=x; });
  box.classList.remove("measure");
  if(!L) return;
  var PAD=16, sc=(w-PAD)/L;
  if(sc>2.4) sc=2.4;
  if(sc<0.72){ sc=0.72; box.classList.add("fitwrap"); }
  box.style.setProperty("--sc",String(Math.floor(sc*1000)/1000));
}
function lineText(z){

  nr=String(nr||"");
  if(/^Refrain/i.test(nr)) return "Refrain";
  var m=nr.match(/(\d+)/);
  if(m) return m[1];
  m=nr.match(/^([^\s]+)/);
  return m?m[1]:nr;
}
function uniqueChords(list){
  var out=[], last="";
  list.forEach(function(c){
    var t=String(c).replace(/\s+/g," ").trim();
    if(t && t!==last){ out.push(t); last=t; }
  });
  return out;
}
function stanzaGroups(P){
  var groups=[], cur=null;
  P.zeilen.forEach(function(z,n){
    var k=stanzaKey(z.nr);
    /* [Grok-Bot] V1.33: Refrain gehört zur Strophe davor, damit er beim Scrollen mit sichtbar ist */
    if(k==="Refrain" && cur){ cur.idx.push(n); return; }
    if(!cur || cur.key!==k){
      cur={ key:k, start:n, idx:[] };
      groups.push(cur);
    }
    cur.idx.push(n);
  });
  return groups;
}
function currentGroupIndex(){
  if(i<0) return -1;
  var gs=stanzaGroups(PRAYERS[i]);
  for(var g=0;g<gs.length;g++){
    if(gs[g].idx.indexOf(line)>=0) return g;
  }
  return 0;
}
function paintList(){
  var box=document.getElementById("list");
  box.innerHTML="";
  PRAYERS.forEach(function(P,idx){
    var b=document.createElement("button");
    b.type="button";
    b.className="item"+(idx===i?" active":"");
    var st=songState(P.id);
    var extra="";
    if(st.time>=5) extra=" · weiter ab "+Math.floor(st.time/60)+":"+String(Math.floor(st.time%60)).padStart(2,"0");
    var tm=tempoMap()[P.id];
    if(tm && tm.tempo && Math.abs(tm.tempo-1)>0.001) extra+=" · Scroll ×"+Number(tm.tempo).toFixed(2);
    if(tm && tm.tempo2) extra+=" → ×"+Number(tm.tempo2).toFixed(2);
    b.innerHTML=P.titel+"<span class='quelle'>"+P.autor+" · "+P.quelle+extra+"</span>";
    b.onclick=function(){ play(idx, true); };
    box.appendChild(b);
  });
}
function paintLyrics(){
  var P=PRAYERS[i];
  var box=document.getElementById("lyrics");
  if(!P){ box.innerHTML=""; return; }
  var gs=stanzaGroups(P);
  box.innerHTML=gs.map(function(g){
    var on=g.idx.indexOf(line)>=0;
    var verse=/^\d+$/.test(g.key)?g.key:"";
    var chs=[];
    var cLast=(P.chordLast || P.id==="suprabhatam") && g.idx.length>1; /* [Grok-Bot] V1.43: Schlusszeile wie Refrain mit eigener Akkordzeile */
    g.idx.forEach(function(n,k){ if(P.zeilen[n].ch && !/^Refrain/i.test(P.zeilen[n].nr) && !(cLast && k===g.idx.length-1)) chs.push(shiftChordLine(P.zeilen[n].ch, steps)); }); /* [Grok-Bot] V1.42: Refrain-Akkorde stehen über dem Refrain */
    chs=uniqueChords(chs);
    var head="";
    if(verse || chs.length){
      head="<div class='head'>"+(verse?"<span class='vn'>"+verse+"</span>":"")+(chs.length?"<span class='ch'>"+chs.join("   ")+"</span>":"")+"</div>";
    }
    var zeile=chMode==="zeile"; /* [Grok.com] Akk: Akkorde gesamt ueber der Strophe. AkkZe: ueber jeder Zeile. Uebersetzung unter der Strophe. */
    var rows=g.idx.map(function(n,k0){
      var z=P.zeilen[n];
      var isR=/^Refrain/i.test(z.nr);
      var isL=cLast && k0===g.idx.length-1;
      var saLines=String(z.sa).split("\n");
      var lch=zeile&&z.lineCh&&z.lineCh.length===saLines.length?z.lineCh:(zeile&&z.ch&&saLines.length>1?saLines.map(function(_,i){ var p=String(z.ch).trim().split(/\s+/); return p[Math.min(i,p.length-1)]||""; }):null);
      var one=zeile&&!lch&&z.ch&&saLines.length===1?"<span class='lch'>"+shiftChordLine(z.ch, steps)+"</span>":""; /* [Grok.com] AkkZe auch bei einzelner Zeile */
      var rch=((isR||isL)&&z.ch&&!lch)?"<span class='rch'>"+shiftChordLine(z.ch, steps)+"</span>":"";
      return "<div class='rowline"+(isR?" refrain":"")+"' data-n='"+n+"'>"+one+rch+"<span class='sa'>"+saLines.map(function(t,k,arr){ var c=lch&&lch[k]?shiftChordLine(lch[k], steps):""; return (c?"<span class='lch'>"+c+"</span>":"")+"<span class='ln'>"+t+((isR||z.x2)&&k===arr.length-1?"<span class='x2'> 2x</span>":"")+"</span>"; }).join("")+"</span></div>";
    }).join("");
    var tr=g.idx.map(function(n){ return lineText(P.zeilen[n]); }).filter(Boolean).join(" ");
    return "<div class='stanza"+(on?" on":"")+"' data-start='"+g.start+"'>"+head+rows+(tr?"<div class='de'>"+tr+"</div>":"")+"</div>";
  }).join("");
  layoutLyrics(); pinStanza();
  box.querySelectorAll(".stanza").forEach(function(el){
    el.onclick=function(){ line=parseInt(el.getAttribute("data-start"),10); persistNow(); paintLyrics(); syncAutoFromLine(); };
  });
}
function ytCmd(fn){
  try{ yt.contentWindow.postMessage(JSON.stringify({event:"command",func:fn,args:[]}),"*"); }catch(e){}
}
function showYt(P, startSec){
  a.pause();
  a.style.display="none";
  ytOn=true; ytPlaying=true;
  ytBox.classList.add("on");
  stage.classList.add("has-yt");
  var start=Math.floor(startSec||P.youtubeStart||0);
  yt.src="https://www.youtube.com/embed/"+P.youtube+"?rel=0&modestbranding=1&enablejsapi=1"+(start?("&start="+start):"");
  markPlayOrigin();
  syncPlayBtn();
  setTimeout(layoutLyrics, 50);
}
function showFile(P){
  ytOn=false; ytPlaying=false;
  ytBox.classList.remove("on");
  stage.classList.remove("has-yt");
  yt.src="";
  a.style.display="block";
  a.onerror=function(){ if(P.youtube) showYt(P, pendingSeek||P.youtubeStart); };
  a.src=P.audio;
  markPlayOrigin();
  a.play().then(function(){ syncPlayBtn(); setTimeout(pinStanza, 120); }).catch(function(){ syncPlayBtn(); }); /* [Grok.com] bei Play zum Lyrics-Fenster */
  setTimeout(layoutLyrics, 50);
}
function togglePlay(){
  if(i<0) return;
  if(ytOn){
    if(ytPlaying){ ytCmd("pauseVideo"); ytPlaying=false; }
    else { ytCmd("playVideo"); ytPlaying=true; markPlayOrigin(); }
    syncPlayBtn(); return;
  }
  if(!a.src){ var P=PRAYERS[i]; if(P && P.audio){ showFile(P); return; } }
  if(a.paused){ markPlayOrigin(); a.play().then(function(){ syncPlayBtn(); setTimeout(pinStanza, 120); }).catch(function(){ syncPlayBtn(); }); /* [Grok.com] bei Play zum Lyrics-Fenster */ }
  else { a.pause(); persistNow(); syncPlayBtn(); }
}
function play(idx, resume){
  document.body.classList.add("has-song"); /* [Grok.com] Startbild aus */
  persistNow();
  i=idx;
  var P=PRAYERS[i];
  var st=resume?songState(P.id):{};
  line=Math.min(st.line||0, Math.max(0, P.zeilen.length-1));
  manualShift=0; /* [Grok-Bot] V1.32 */
  steps=(typeof st.steps==="number")?st.steps:0;
  autoScroll=!!st.autoScroll;
  scrollTempo=(typeof st.scrollTempo==="number" && st.scrollTempo>0.3)?st.scrollTempo:1;
  restoreTempo(P.id);
  markPlayOrigin();
  pendingSeek=st.time||0;
  if(P.zeilen.length && pendingSeek && a.duration && pendingSeek>a.duration-4) pendingSeek=0;
  document.getElementById("now").textContent=P.titel;
  document.getElementById("hint").textContent=(lang==="en"?(P.hinweisEn||P.hinweis):(P.hinweisDe||P.hinweis))||"";
  a.pause();
  a.removeAttribute("src");
  a.load();
  try{ yt.src=""; ytOn=false; }catch(e){} /* [Grok.com] alter Ton darf nicht weiterlaufen */
  a.setAttribute("data-prayer", P.id);
  if(P.preferFile && P.audio) showFile(P);
  else if(P.youtube) showYt(P, pendingSeek||P.youtubeStart);
  else if(P.audio) showFile(P);
  putSong(P.id, { line:line, time:pendingSeek||0, showDe:showDe, showCh:showCh, lang:lang, steps:steps, autoScroll:autoScroll, scrollTempo:scrollTempo });
  rememberTempo();
  paintList(); paintLyrics(); syncPlayBtn(); applyUI();
  try{ document.body.focus(); }catch(e){}
}
function nextLine(){
  if(i<0) return;
  var gs=stanzaGroups(PRAYERS[i]);
  var n=currentGroupIndex();
  if(n>=0 && n<gs.length-1) line=gs[n+1].start;
  persistNow(); paintLyrics();
  syncAutoFromLine();
}
function prevLine(){
  if(i<0) return;
  var gs=stanzaGroups(PRAYERS[i]);
  var n=currentGroupIndex();
  if(n>0) line=gs[n-1].start;
  persistNow(); paintLyrics();
  syncAutoFromLine();
}
function shiftSteps(d, reset){
  if(reset) steps=0; else steps+=d;
  if(steps>11) steps-=12;
  if(steps<-11) steps+=12;
  if(!showCh){ showCh=true; document.body.classList.add("show-ch"); }
  persistNow(); applyUI(); paintLyrics();
}
function toggleDe(){
  showDe=!showDe;
  document.body.classList.toggle("show-de", showDe);
  applyUI();
  try{ localStorage.setItem("bpp-de", showDe?"1":"0"); }catch(e){}
  persistNow();
}
function applyCh(){
  showCh=chMode==="akk";
  document.body.classList.toggle("show-ch", showCh);
  document.body.classList.toggle("ch-line", chMode==="zeile");
}
function toggleCh(){
  chMode=chMode==="akk"?"zeile":(chMode==="zeile"?"aus":"akk"); /* [Grok.com] Akk, AkkZe, NoAkk */
  applyCh();
  applyUI();
  try{ localStorage.setItem("bpp-chmode", chMode); }catch(e){}
  persistNow();
}
function onKey(e){
  if(e.ctrlKey || e.altKey || e.metaKey) return;
  var t=e.target;
  if(t && (t.tagName==="INPUT" || t.tagName==="TEXTAREA" || t.isContentEditable)) return;
  var code=e.code||"";
  var k=(e.key||"").toLowerCase();
  if(code==="Space" || k===" "){ e.preventDefault(); togglePlay(); return; }
  if(code==="KeyN" || k==="n"){ e.preventDefault(); nextLine(); }
  if(code==="KeyV" || k==="v"){ e.preventDefault(); prevLine(); }
}
a.addEventListener("loadedmetadata", function(){
  if(pendingSeek>=3 && isFinite(a.duration) && pendingSeek<a.duration-4){
    try{ a.currentTime=pendingSeek; }catch(e){}
  }
  syncPlayBtn();
});
a.addEventListener("play", syncPlayBtn);
a.addEventListener("playing", syncPlayBtn);
a.addEventListener("pause", function(){ persistNow(); syncPlayBtn(); });
a.addEventListener("timeupdate", function(){

  if(now-lastSave<2500) return;

});
a.addEventListener("ended", function(){

document.addEventListener("visibilitychange", function(){ if(document.hidden) persistNow(); });
window.addEventListener("pagehide", persistNow);

/* [Grok-Bot] V1.32: nach Klick ins YouTube-Video Fokus zurückholen, sonst kommen N/V/Leertaste nicht an */
window.addEventListener("blur", function(){ setTimeout(function(){ var ae=document.activeElement; if(ae && ae.tagName==="IFRAME"){ try{ window.focus(); document.body.focus(); }catch(e){} } }, 0); });
window.addEventListener("resize", layoutLyrics);
try{ document.fonts.ready.then(layoutLyrics); }catch(e){} /* [Grok-Bot] V1.37 */
try{ new ResizeObserver(layoutLyrics).observe(document.getElementById("lyrics")); }catch(e){}
try{ if(localStorage.getItem("bpp-lang")==="en") lang="en"; }catch(e){}
try{ if(localStorage.getItem("bpp-de")==="1"){ showDe=true; document.body.classList.add("show-de"); } }catch(e){}
try{ chMode=localStorage.getItem("bpp-chmode")||(localStorage.getItem("bpp-ch")==="1"?"akk":"aus"); applyCh(); }catch(e){}
applyUI();
paintList();
layoutLyrics();
(function resumeLast(){
