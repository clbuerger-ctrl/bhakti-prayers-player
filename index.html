<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bhakti Prayers Player V1.1</title>
<!-- [Grok.com] Akkorde aus Prathana with chords, nur auf Knopf. -->
<style>
:root{--bg:#1a1410;--gold:#c9a36a;--text:#f3e6d0;--muted:#b7a48c;--card:#2a211b}
*{box-sizing:border-box}
body{margin:0;font-family:Georgia,serif;background:var(--bg);color:var(--text)}
header{padding:14px 16px 8px;text-align:center}
h1{margin:0;color:var(--gold);font-weight:normal;font-size:1.55rem}
h1 .ver{font-size:.62em;color:var(--muted);font-weight:normal;margin-left:.35em}
.sub{color:var(--muted);margin:6px auto 0;font-size:.92rem;max-width:42rem;line-height:1.4}
.bar{position:sticky;top:0;background:var(--bg);border-bottom:1px solid #3d2f26;padding:8px 12px;z-index:20}
.now{min-height:1.2em;padding:2px 0 6px}
audio{width:100%;height:36px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
button{background:#4a372b;color:var(--text);border:1px solid #6b5340;border-radius:7px;padding:8px 12px;min-height:40px}
button.gold{background:#8b6914;border-color:var(--gold)}
button.on{background:#8b6914;border-color:var(--gold)}
.list{margin:10px 12px;display:grid;gap:8px}
@media(min-width:800px){.list{grid-template-columns:1fr 1fr 1fr}}
.item{text-align:left;padding:10px;background:transparent;width:100%}
.item.active{background:#4a372b;color:var(--gold)}
.quelle{display:block;color:var(--muted);font-size:.76rem;margin-top:4px}
.stage{margin:10px 12px;display:grid;gap:10px}
@media(min-width:900px){.stage.has-yt{grid-template-columns:minmax(240px,38%) 1fr}}
#ytBox{display:none;width:100%;aspect-ratio:16/9;background:#000;border-radius:8px;overflow:hidden}
#ytBox.on{display:block}
#ytBox iframe{width:100%;height:100%;border:0}
.panel{background:var(--card);border:1px solid #6b5340;border-radius:12px;max-height:62vh;overflow:auto;padding:10px 14px}
.line{padding:10px 6px;border-radius:6px;cursor:pointer}
.line .nr{display:block;color:var(--gold);font-size:.78rem;margin-bottom:2px}
.line .ch{display:none;font-family:Consolas,Menlo,monospace;color:#e8c27a;font-size:.88rem;letter-spacing:.04em;white-space:pre-wrap;margin:0 0 2px}
body.show-ch .line .ch{display:block}
.line .sa{display:block;line-height:1.45}
.line .de{display:none;color:var(--muted);font-size:.92rem;margin-top:6px;line-height:1.4}
body.show-de .line .de{display:block}
.line.on{background:#4a372b}
.line.on .de{color:#e4d2b4}
.hint{color:var(--muted);font-size:.85rem;margin:0 12px 16px}
footer{text-align:center;padding:18px;color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
<header>
  <h1>Bhakti Prayers Player <span class="ver">V1.1</span></h1>
  <p class="sub">YouTube zum Hören, Sanskrit zum Mitsingen. Übersetzung und Akkorde nur auf Knopf — Akkorde aus dem Prathana-Musikerheft.</p>
</header>
<div class="bar">
  <div class="now" id="now">Einen Gesang wählen</div>
  <audio id="a" controls preload="none" playsinline></audio>
  <div class="row">
    <button type="button" onclick="prevLine()">Vorherige Zeile</button>
    <button type="button" class="gold" onclick="nextLine()">Nächste Zeile</button>
    <button type="button" id="btnDe" onclick="toggleDe()">Übersetzung aus</button>
    <button type="button" id="btnCh" onclick="toggleCh()">Akkorde aus</button>
  </div>
</div>
<div class="list" id="list"></div>
<p class="hint" id="hint"></p>
<div class="stage" id="stage">
  <div id="ytBox"><iframe id="yt" title="YouTube" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>
  <div class="panel" id="lyrics"></div>
</div>
<footer>Persönliches Lernen. Akkorde: Prathana with chords, Daily Prayer Edition. Mukunda Mala hat im Heft keine Akkorde.</footer>
<script src="prayers.js"></script>
<script>
var i=-1, line=0, showDe=false, showCh=false;
var a=document.getElementById("a");
var ytBox=document.getElementById("ytBox");
var yt=document.getElementById("yt");
var stage=document.getElementById("stage");
function paintList(){
  var box=document.getElementById("list");
  box.innerHTML="";
  PRAYERS.forEach(function(P,idx){
    var b=document.createElement("button");
    b.type="button";
    b.className="item"+(idx===i?" active":"");
    b.innerHTML=P.titel+"<span class='quelle'>"+P.autor+" · "+P.quelle+"</span>";
    b.onclick=function(){ play(idx); };
    box.appendChild(b);
  });
}
function paintLyrics(){
  var P=PRAYERS[i];
  var box=document.getElementById("lyrics");
  if(!P){ box.innerHTML=""; return; }
  box.innerHTML=P.zeilen.map(function(z,n){
    var nr=z.nr||("Zeile "+(n+1));
    var ch=z.ch?"<span class='ch'>"+z.ch+"</span>":"";
    return "<div class='line"+(n===line?" on":"")+"' data-n='"+n+"'><span class='nr'>"+nr+"</span>"+ch+"<span class='sa'>"+z.sa+"</span><span class='de'>"+(z.ue||"")+"</span></div>";
  }).join("");
  var on=box.querySelector(".line.on");
  if(on) on.scrollIntoView({block:"center",behavior:"smooth"});
  box.querySelectorAll(".line").forEach(function(el){
    el.onclick=function(){ line=parseInt(el.getAttribute("data-n"),10); paintLyrics(); };
  });
}
function play(idx){
  i=idx; line=0;
  var P=PRAYERS[i];
  document.getElementById("now").textContent=P.titel;
  document.getElementById("hint").textContent=P.hinweis||"";
  a.pause();
  a.removeAttribute("src");
  a.load();
  if(P.youtube){
    a.style.display="none";
    ytBox.classList.add("on");
    stage.classList.add("has-yt");
    yt.src="https://www.youtube.com/embed/"+P.youtube+"?rel=0&modestbranding=1";
  } else {
    ytBox.classList.remove("on");
    stage.classList.remove("has-yt");
    yt.src="";
    a.style.display="block";
    a.src=P.audio;
    a.play().catch(function(){});
  }
  paintList(); paintLyrics();
}
function nextLine(){ if(i<0) return; line=Math.min(line+1, PRAYERS[i].zeilen.length-1); paintLyrics(); }
function prevLine(){ if(i<0) return; line=Math.max(line-1, 0); paintLyrics(); }
function toggleDe(){
  showDe=!showDe;
  document.body.classList.toggle("show-de", showDe);
  var b=document.getElementById("btnDe");
  b.textContent=showDe?"Übersetzung an":"Übersetzung aus";
  b.classList.toggle("on", showDe);
  try{ localStorage.setItem("bpp-de", showDe?"1":"0"); }catch(e){}
}
function toggleCh(){
  showCh=!showCh;
  document.body.classList.toggle("show-ch", showCh);
  var b=document.getElementById("btnCh");
  b.textContent=showCh?"Akkorde an":"Akkorde aus";
  b.classList.toggle("on", showCh);
  try{ localStorage.setItem("bpp-ch", showCh?"1":"0"); }catch(e){}
}
try{ if(localStorage.getItem("bpp-de")==="1") toggleDe(); }catch(e){}
try{ if(localStorage.getItem("bpp-ch")==="1") toggleCh(); }catch(e){}
paintList();
</script>
</body>
</html>
